# TxHarbor local dependencies.
#
# Default baseline (001–011): PostgreSQL + Anvil only, both bound to
# 127.0.0.1; `docker compose up -d` keeps the PG-only baseline runnable
# (FR-28/V-BASE). Go services run on the host.
#
# 013 reliable event infrastructure adds Redis + Kafka (single-node KRaft)
# under the `events` profile:
#   docker compose --profile events up -d
# The profile also creates the canonical topic explicitly
# (txharbor.events.v1, 6 partitions) and keeps broker-side auto-creation off,
# so a typo in a topic name surfaces as an error instead of materializing a
# topic (research R17). Image tags were verified available and start-tested
# on 2026-09-24 (T002/T004 evidence).
name: txharbor

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: txharbor
      POSTGRES_PASSWORD: txharbor
      POSTGRES_DB: txharbor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.1
    # Image entrypoint is /bin/sh -c, which would swallow command args:
    # override it so anvil receives --host 0.0.0.0 and binds the
    # container interface (defaults bind 127.0.0.1 inside the container).
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 5s
      retries: 10

  # 013: non-authoritative cache + rate-limit carrier (FR-02; contracts/redis.md).
  redis:
    image: redis:8.2.10-alpine
    profiles: ["events"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  # 013: single-node KRaft broker (research R17). Two listeners: EXTERNAL for
  # host processes (Go services) and INTERNAL for the one-shot topic init.
  kafka:
    image: apache/kafka:4.1.0
    profiles: ["events"]
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s

  # 013: explicit topic creation (no auto-create). One-shot; exits 0 after
  # `--create --if-not-exists`, so repeated `up` runs stay idempotent.
  kafka-topic-init:
    image: apache/kafka:4.1.0
    profiles: ["events"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic txharbor.events.v1
        --partitions 6 --replication-factor 1
    restart: "no"

volumes:
  pgdata:
