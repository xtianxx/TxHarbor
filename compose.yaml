# TxHarbor local dependencies for 001-project-foundation.
# Both services bind to 127.0.0.1 only. Go services run on the host.
name: txharbor

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: txharbor
      POSTGRES_PASSWORD: txharbor
      POSTGRES_DB: txharbor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.1
    command: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
