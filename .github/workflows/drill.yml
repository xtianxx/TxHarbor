# Recovery Drill: independent layer (FR-030/033; quickstart.md §3;
# verification.md §4).
#
# The full disaster-recovery drill (S1-S12 + the F1-F7 failure matrix; real
# PG/Anvil and, for the event-layer scenario, Kafka) is long and Docker-backed.
# It never runs on ordinary pull requests and never blocks them; it runs on a
# schedule or manual dispatch. A failure here does not block PRs, but it DOES
# block the corresponding recovery claim: without a green run of this workflow
# there is no evidence to claim the drill (no evidence -> no claim).
#
# An unrun drill must never read as a pass (NOT RUN discipline, FR-033):
#
#   - no `drill`-tagged test in the tree: `make test-drill` reports NOT RUN and
#     exits non-zero (the Makefile require_tagged_tests guard);
#   - tests present but a required scenario cannot run (including missing
#     Docker/Kafka dependencies): the go test JSON coverage checker makes the
#     target fail and names the scenario as NOT RUN, even if its parent test
#     reports PASS after a nested skip;
#   - skips in unrelated optional tests remain allowed;
#   - an interrupted/partial run (job canceled, timeout) leaves the job red and
#     produces no claimable evidence.
#
# The independent drill runs inside the pinned official PostgreSQL image so
# the Go test process itself discovers and executes the native pg_dump/pg_restore
# ELF binaries (not a docker-exec shim). The wrapper mounts the checkout and Go
# module cache read-only, a writable build/temp scratch directory, and the host
# Docker socket/CLI. It uses Go's pure-Go implementations (the minimal pinned
# image has no C compiler), then verifies PostgreSQL tool versions/ELF format
# and Docker connectivity before invoking the enforcing `make test-drill`.
# Docker is required: testcontainers provisions its own pinned images
# (postgres:18.6-trixie, foundry v1.8.1 and, once the event-layer scenario
# runs, confluentinc/confluent-local:7.9.10); nothing floats and no external
# service is contacted.
#
# Evidence archive: the drill tests write their S12-structured run records to
# $TXHARBOR_DRILL_EVIDENCE_DIR (set below to ${{ runner.temp }}/drill-evidence
# on the host and bind-mounted at /drill-evidence in the runner container,
# never a repository path) and the directory is uploaded as the run artifact
# `drill-evidence-<run_id>` so a claim can cite a durable run record. Local
# inputs only: the records carry explicit non-claims; production RPO/RTO/
# cadence/retention remain undecided deployment questions (T000-P OPEN).
name: Recovery Drill

on:
  schedule:
    # Weekly, off-peak; the cadence is operational, not a budget claim.
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drill-${{ github.ref }}
  cancel-in-progress: false

# Fictional credentials only (same rationale as ci.yml / fault-perf.yml).
env:
  TXHARBOR_PG_DSN: postgres://txharbor:txharbor@127.0.0.1:5432/txharbor?sslmode=disable
  TXHARBOR_RPC_URL: http://127.0.0.1:8545
  TXHARBOR_CHAIN_ID: "31337"

jobs:
  drill:
    name: full recovery drill (S1-S12 + F1-F7, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: verify Docker daemon for testcontainers
        run: docker info
        timeout-minutes: 5
      - name: mask test credentials in logs
        run: |
          set -euo pipefail
          echo "::add-mask::${TXHARBOR_PG_DSN}"
      - name: full recovery drill layer (pinned native-tool runner)
        env:
          TXHARBOR_DRILL_EVIDENCE_DIR: ${{ runner.temp }}/drill-evidence
          TXHARBOR_COMMIT: ${{ github.sha }}
        run: scripts/drillcoverage/run-in-container.sh
        timeout-minutes: 200
      - name: upload drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drill-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/drill-evidence
          if-no-files-found: warn
          retention-days: 30
