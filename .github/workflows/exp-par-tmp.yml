# TEMPORARY experiment workflow for PR #24 only (A/B parallelism probe).
# Delete after use. Must NOT be added to required checks, must NOT touch
# formal CI (ci.yml), Makefile, business code or test assertions.
# Trigger: pull_request ONLY (pushing this file fires one attached PR run
# plus the normal required CI). No workflow_dispatch by design, so there is
# no unregistered-workflow dispatch question at all.
# Order: A (default -p) then C (-p 8) sequentially in ONE job on ONE runner
# (same machine class, no inter-group contention). A cold (build cache +
# image pulls), C warm: report MUST disclose this asymmetry; single A->C is
# not a final parallelism verdict (C->A reverse needed for confirmation).
name: EXP par-AC (temporary, delete after use)
on:
  pull_request:
    branches: [main]
concurrency:
  group: exp-par-pr24
  cancel-in-progress: false
env:
  TXHARBOR_PG_DSN: postgres://txharbor:txharbor@127.0.0.1:5432/txharbor?sslmode=disable
  TXHARBOR_RPC_URL: http://127.0.0.1:8545
  TXHARBOR_CHAIN_ID: "31337"
jobs:
  exp-ac:
    # Limited to PR #24. Same HEAD is guaranteed: both groups run after the
    # single checkout of this run's ref.
    if: github.event.pull_request.number == 24
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: record environment
        run: |
          set -euo pipefail
          go version
          echo "GOFLAGS=$(go env GOFLAGS)"
          echo "GOMAXPROCS=$(go env GOMAXPROCS)"
          nproc
          free -g | head -2
          docker info --format '{{.NCPU}}cpu {{.MemTotal}}'
          git rev-parse HEAD
      - name: A default parallelism
        run: |
          set +e
          M0=$(python3 -c 'import time;print(time.monotonic())')
          U0=$(date -u +%FT%TZ)
          echo "CMD: GOMAXPROCS=4 go test -tags integration -count=1 -timeout 20m -json ./..." > par-a.cmd
          GOMAXPROCS=4 go test -tags integration -count=1 -timeout 20m -json ./... > par-a.json 2> par-a.stderr
          RC=$?
          M1=$(python3 -c 'import time;print(time.monotonic())')
          U1=$(date -u +%FT%TZ)
          printf 'start_utc=%s mono_start=%s end_utc=%s mono_end=%s rc=%s\n' "$U0" "$M0" "$U1" "$M1" "$RC" > par-a.meta
          echo "A rc=$RC"
          exit "$RC"
      - name: C p8
        # Default if: success() — skipped when A fails (item 2). Skipped C is
        # reported as SKIPPED_DUE_TO_A_FAILURE by summarize, never as a C failure.
        run: |
          set +e
          M0=$(python3 -c 'import time;print(time.monotonic())')
          U0=$(date -u +%FT%TZ)
          echo "CMD: GOMAXPROCS=4 go test -p 8 -tags integration -count=1 -timeout 20m -json ./..." > par-c.cmd
          GOMAXPROCS=4 go test -p 8 -tags integration -count=1 -timeout 20m -json ./... > par-c.json 2> par-c.stderr
          RC=$?
          M1=$(python3 -c 'import time;print(time.monotonic())')
          U1=$(date -u +%FT%TZ)
          printf 'start_utc=%s mono_start=%s end_utc=%s mono_end=%s rc=%s\n' "$U0" "$M0" "$U1" "$M1" "$RC" > par-c.meta
          echo "C rc=$RC"
          exit "$RC"
      - name: summarize (verdict, never green on failure)
        if: always()
        run: |
          set +e
          FAIL=0
          A_RC=""
          [ -f par-a.rc ] && A_RC=$(cat par-a.rc)
          for g in a c; do
            for f in par-$g.json par-$g.stderr par-$g.rc par-$g.meta par-$g.cmd; do
              if [ ! -f "$f" ]; then
                if [ "$g" = "c" ] && [ ! -f par-c.rc ] && { [ -z "$A_RC" ] || [ "$A_RC" != "0" ]; }; then
                  echo "$g: $f MISSING because C was skipped (SKIPPED_DUE_TO_A_FAILURE)"
                else
                  echo "$g: MISSING $f"
                  FAIL=1
                fi
              fi
            done
          done
          if [ ! -f par-c.rc ] && { [ -z "$A_RC" ] || [ "$A_RC" != "0" ]; }; then
            echo "C: SKIPPED_DUE_TO_A_FAILURE (A rc=${A_RC:-MISSING}) — not a C test failure"
          fi
          for g in a c; do
            [ -f par-$g.rc ] || continue
            RC=$(cat par-$g.rc)
            echo "$g: rc=$RC"
            [ "$RC" = "0" ] || FAIL=1
            [ -f par-$g.json ] || continue
            python3 - "par-$g.json" "$g" <<'PYEOF' || { echo "$g: JSON CORRUPT/TRUNCATED"; FAIL=1; }
          import json, sys
          path, g = sys.argv[1], sys.argv[2]
          raw = open(path, 'rb').read()
          if not raw.endswith(b'\n'):
              print(f"{g}: TRUNCATED (no trailing newline)")
              sys.exit(3)
          pkg = {'pass': 0, 'fail': 0, 'skip': 0}
          top = {'pass': 0, 'fail': 0, 'skip': 0}
          sub = {'pass': 0, 'fail': 0, 'skip': 0}
          seen_run = set()
          terminal = set()
          n = 0
          for line in raw.decode().splitlines():
            n += 1
            try:
                e = json.loads(line)
            except Exception:
                print(f"{g}: CORRUPT line {n}")
                sys.exit(3)
            p = e.get('Package', '')
            t = e.get('Test', '')
            a = e.get('Action', '')
            if p:
                seen_run.add(p)
            if a in ('pass', 'fail', 'skip'):
                if not t:
                    pkg[a] += 1
                    terminal.add(p)
                elif '/' in t:
                    sub[a] += 1
                else:
                    top[a] += 1
          missing = sorted(seen_run - terminal)
          print(f"{g}: packages pass/fail/skip={pkg} top-level={top} subtests={sub}")
          if missing:
              print(f"{g}: TRUNCATED packages without terminal event: {missing}")
              sys.exit(3)
          PYEOF
            [ $? -eq 0 ] || FAIL=1
          done
          if [ "$FAIL" = "0" ]; then echo "VERDICT: GREEN"; else echo "VERDICT: RED"; fi
          exit "$FAIL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: par-evidence
          if-no-files-found: error
          path: |
            par-a.json
            par-a.stderr
            par-a.rc
            par-a.meta
            par-a.cmd
            par-c.json
            par-c.stderr
            par-c.rc
            par-c.meta
            par-c.cmd
